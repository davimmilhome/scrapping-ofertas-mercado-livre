[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "offers-spider"
version = "0.2.0"
description = "Coleta e histórico diário de ofertas do Mercado Livre"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "selenium>=4.26,<5",
  "SQLAlchemy>=2.0,<3",
  "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2,<4"]
dev = ["pytest>=8,<10", "ruff==0.17.2", "pre-commit>=4,<5"]

[project.scripts]
offers-spider = "offers_spider.cli:main"

[tool.setuptools.packages.find]
include = ["offers_spider*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
