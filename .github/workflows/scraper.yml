name: Scraper

on:
  schedule:
    # 01:17 no horário de Brasília (04:17 UTC), evitando o início da hora.
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      pages:
        description: "Número de páginas para a execução manual"
        required: false
        default: "1"
        type: string

permissions:
  contents: read

concurrency:
  group: scraper-production
  cancel-in-progress: false

jobs:
  collect:
    # A coleta precisa sair pela rede onde o Mercado Livre é acessível.
    # O runner auto-hospedado mantém o Actions como agendador e executor.
    runs-on: [self-hosted, offers-spider]
    timeout-minutes: 20
    env:
      APP_ENV: production
      DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      # A variante Sparkle evita a página de erro retornada para alguns IPs
      # de datacenter quando a rota legada /ofertas é acessada diretamente.
      BASE_URL: https://www.mercadolivre.com.br/ofertas?isSparkleRedirect=true
      OUTPUT_PATH: output/offers.json
      BROWSER: chrome
      HEADLESS: "true"
      TIMEOUT: "20"
      RETRIES: "2"
      REQUEST_DELAY: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install scraper
        run: python -m pip install ".[postgres]"
      - name: Verify browser
        run: google-chrome --version
      - name: Run scraper
        run: offers-spider --app-env production --pages "${{ inputs.pages || '1' }}"
      - name: Upload JSON snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offers-${{ github.run_id }}
          path: output/
          if-no-files-found: ignore
          retention-days: 7
